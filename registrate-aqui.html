<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>

  <main class="card">
    <a href="login.html" class="back-link">&larr; Volver al inicio de sesión</a>
    
    <h2>Crear cuenta</h2>
    <p class="subtitle">Completa el formulario para registrarte en el sistema.</p>

    <form id="registerForm">
      <div class="form-row">
        <div class="form-group">
          <label for="run">RUN (sin puntos ni guión)</label>
          <input type="text" id="run" placeholder="123456785" required>
        </div>
        <div class="form-group">
          <label for="userType">Tipo de usuario</label>
          <select id="userType" required>
            <option value="Cliente" selected>Cliente</option>
            <option value="Administrador">Administrador</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Nombre</label>
          <input type="text" id="firstName" placeholder="María" required>
        </div>
        <div class="form-group">
          <label for="lastName">Apellidos</label>
          <input type="text" id="lastName" placeholder="González López" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña (4-10 caracteres)</label>
        <input type="password" id="password" placeholder="••••••••" minlength="4" maxlength="10" required>
      </div>

      <div class="form-group">
        <label for="birthDate">Fecha de nacimiento (opcional)</label>
        <input type="date" id="birthDate">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="region">Región</label>
          <select id="region" required>
            <option value="" disabled selected>Seleccionar región</option>
            <option value="rm">Región Metropolitana</option>
            <option value="valparaiso">Valparaíso</option>
            <option value="biobio">Bío Bío</option>
          </select>
        </div>
        <div class="form-group">
          <label for="comuna">Comuna</label>
          <select id="comuna" disabled required>
            <option value="" disabled selected>Seleccionar comuna</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Dirección</label>
        <input type="text" id="address" placeholder="Av. Principal 123" required>
      </div>

      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>
  </main>

  <script src="registrate.js"></script>
</body>
</html>
