<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria San Marcos - Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="estilos/index.css">
  <link rel="stylesheet" href="estilos/med.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Encabezado / Navbar unificado -->
  <header class="bg-white border-bottom shadow-sm">
    <nav class="navbar navbar-expand-lg container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <span class="badge bg-dark p-2 rounded"> </span> Veterinaria San Marcos
      </a>
      <div class="collapse navbar-collapse show" id="navbarContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold" href="medicamentos.html">Medicamentos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="servicio.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-cart3 fs-5"></i>
                    <span class="fw-semibold">Cart (0)</span>
                </div>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5 flex-grow-1">
    <div class="mb-4">
      <a href="medicamentos.html" class="btn btn-outline-success btn-sm mb-3">
        <i class="bi bi-arrow-left"></i> Volver a Categorías
      </a>
      <h2 id="tituloCategoria" class="display-6 titulo-serif fw-bold text-success">Categoría</h2>
      <p class="text-secondary">Productos veterinarios disponibles en esta sección.</p>
    </div>

    <!-- Contenedor dinámico de tarjetas -->
    <div id="gridProductos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </main>

  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-0 small text-muted">&copy; 2026 Veterinaria San Marcos. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/meds.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const categoria = localStorage.getItem("categoriaSeleccionada");
      const titulo = document.getElementById("tituloCategoria");
      const grid = document.getElementById("gridProductos");

      if (!categoria) {
        window.location.href = "medicamentos.html";
        return;
      }

      titulo.textContent = categoria;

      const catalogo = JSON.parse(localStorage.getItem("medicamentosvet")) || [];
      const productosFiltrados = catalogo.filter(p => p.categoria.toLowerCase() === categoria.toLowerCase());

      if (productosFiltrados.length === 0) {
        grid.innerHTML = `
          <div class="col-12">
            <div class="alert alert-warning text-center">No se encontraron productos en esta categoría.</div>
          </div>`;
        return;
      }

      grid.innerHTML = "";
      productosFiltrados.forEach(prod => {
        grid.innerHTML += `
          <div class="col">
            <div class="card h-100 border-0 shadow-sm rounded-4 p-3 bg-white d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25">${prod.especie}</span>
                <span class="text-muted small">${prod.codigo}</span>
              </div>
              <h3 class="fs-5 fw-bold text-dark mb-1">${prod.nombre}</h3>
              <p class="text-muted small mb-1"><strong>Principio:</strong> ${prod.principio}</p>
              <p class="text-muted small mb-3"><strong>Formato:</strong> ${prod.presentacion}</p>
              
              <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                <span class="fs-5 fw-bold text-success">$${prod.precio.toLocaleString("es-CL")}</span>
                <button onclick="verDetalleProducto('${prod.codigo}')" class="btn btn-outline-success btn-sm rounded-pill px-3">
                  Ver detalle &rarr;
                </button>
              </div>
            </div>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
