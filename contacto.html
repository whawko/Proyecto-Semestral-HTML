<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Veterinaria San Marcos</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos personalizados -->
   <link rel="stylesheet" href="estilos/index.css">
</head>
<body>

  <!-- Navegación principal -->
  <header class="bg-white border-bottom shadow-sm">
        <nav class="navbar navbar-expand-lg container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <span class="badge bg-dark p-2 rounded"> </span> Veterinaria San Marcos
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3">
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catalogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="noticias.html">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
  </nav>
  </header>

  <!-- Sección de Contacto -->
  <main class="container my-3">
    <div class="contact-wrapper text-center">

      <!-- Imagen superior -->
      <div class="col-lg-6">
                    <img src="img/contacto.avif" class="img-fluid rounded border border-dark border-2 w-100 img-center" alt="Banner">
                </div>

      <!-- Título de la sección -->
      <h2 class="page-heading mb-4">Veterinaria San Marcos</h2>

      <!-- Tarjeta del formulario estilo Wireframe/Mockup -->
      <div class="mockup-card text-start">
        <div class="mockup-header text-center">
          Formulario de Contacto
        </div>

        <form class="mockup-body" action="#" method="POST">
          <div class="mb-3">
            <label for="nombre" class="form-label">NOMBRE COMPLETO</label>
            <input type="text" class="form-control mockup-input" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
          </div>

          <div class="mb-3">
            <label for="correo" class="form-label">CORREO</label>
            <input type="email" class="form-control mockup-input" id="correo" name="correo" placeholder="tu.correo@ejemplo.com" required>
          </div>

          <div class="mb-4">
            <label for="contenido" class="form-label">CONTENIDO</label>
            <textarea class="form-control mockup-input" id="contenido" name="contenido" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-submit">
              <i class="bi bi-envelope-fill me-1"></i> ENVIAR MENSAJE
            </button>
          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center py-3 text-muted border-top small">
    &copy; 2026 Veterinaria San Marcos. Todos los derechos reservados.
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
